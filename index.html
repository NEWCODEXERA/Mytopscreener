<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DMAScreener Pro Terminal</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <aside class="sidebar">
            <div class="brand">
                <h2><span class="neon-dot"></span> DMAScreener</h2>
                <p>Live Scanning Matrix</p>
            </div>
            <nav class="nav-menu" id="navMenu">
                </nav>
        </aside>

        <main class="main-content">

                    <h1 id="currentPageTitle">Executive Dashboard</h1>

                    </div>
                </div>
                <p id="currentPageDesc" class="strategy-sub">Strategy Framework Interface</p>

            <section class="view-panel" id="viewPanel">

    <script src="data.js"></script>
