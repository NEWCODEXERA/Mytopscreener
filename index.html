<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AlphaQuant Stock Screener Hub</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand">
                <h2>📊 AlphaQuant</h2>
                <p>Screener Hub v1.0</p>
            </div>
            <nav class="nav-menu" id="navMenu">
                <!-- Navigation links injected dynamically by app.js -->
            </nav>
        </aside>

        <!-- Main Workspace Area -->
        <main class="main-content">
            <header class="content-header">
                <h1 id="currentPageTitle">Executive Dashboard</h1>
                <p id="currentPageDesc">Synchronized Matrix Interface for system-wide technical scans.</p>
            </header>

            <!-- Dynamic Views Container -->
            <section class="view-panel" id="viewPanel">
                <!-- Content layouts are drawn dynamically by app.js -->
            </section>
        </main>
    </div>
    <script src="data.js"></script>
    <script src="app.js"></script>
</body>
</html>
